name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # Architecture rules (dependency-cruiser), unit and API tests (Vitest + Supertest).
      - run: npm test
      - run: npm run build

  # Publishes docker.io/<DOCKERHUB_USERNAME>/payflow-bff:<tag> when a v* tag is pushed.
  # Needs the repository secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN.
  image:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/payflow-bff:${{ github.ref_name }}
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/payflow-bff:latest
